name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CGO_ENABLED: "0"
  NTCONFINE_REQUIRE_SANDBOX: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Vet
        run: |
          go vet ./...
          go -C pkg/confine vet ./...
      - name: Test (root and pkg/confine, sandbox required)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            go test -race -count=1 ./...
            go -C pkg/confine test -race -count=1 ./...
          else
            go test -count=1 ./...
            go -C pkg/confine test -count=1 ./...
          fi
      - name: Build stage and run Rust client integration test
        run: |
          go build -o bin/ntconfine-stage ./cmd/ntconfine-stage
          cd rust/ntconfine-client && cargo test
      - name: Cross-build (js/wasm, windows/amd64, linux/amd64, linux/arm64)
        run: |
          GOOS=js GOARCH=wasm go build .
          GOOS=js GOARCH=wasm go -C pkg/confine build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go -C pkg/confine build ./...
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: Check third-party notices
        run: |
          mkdir -p dist
          go run ./internal/tools/notices > dist/THIRD_PARTY_NOTICES.md
          cmp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
      - name: Smoke fuzz
        run: |
          go test -run=^$ -fuzz=FuzzVerifyLicenseKey -fuzztime=1000x .
          go test -run=^$ -fuzz=FuzzPolicyValidate -fuzztime=1000x .
          go -C pkg/confine test -run=^$ -fuzz=FuzzDecodeStageSpec -fuzztime=1000x .
          go -C pkg/confine test -run=^$ -fuzz=FuzzSanitizeTerminalText -fuzztime=1000x .
